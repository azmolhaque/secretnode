name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests set a default themselves, but make the intent explicit.
      SECRETNODE_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Run test suite
        run: pytest

      # A scanner's whole value is that its findings can be trusted, so a
      # precision regression is release-blocking, not a warning. This measures
      # the deterministic detection layer against the labelled corpus and fails
      # the build if precision or recall drops.
      - name: Detection quality gate (precision/recall)
        run: make bench

      # The labelled corpus above and the ground-truth corpus both derive their
      # specimens from the registry's own regexes, so neither can tell you that a
      # pattern's LENGTH is wrong — it will happily match the specimen it
      # generated. This corpus is built from issuer documentation instead, and it
      # is release-blocking for the same reason: a detector that cannot match a
      # real credential turns a scan into a CLEAN verdict it has not earned.
      - name: Vendor-shape gate (do the patterns match real credentials?)
        run: make bench-vendor

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t secretnode:ci .
